name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    container:
      image: rust:1.85.0-bookworm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build binaries
        run: cargo build --locked --release --workspace --bins

      - name: Package binaries
        run: tar -czf traversal-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz -C target/release traversal traversal-lsp

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: traversal-*.tar.gz

  build-macos:
    name: Build macOS binaries
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Build binaries
        run: cargo build --locked --release --workspace --bins

      - name: Package binaries
        run: tar -czf traversal-${GITHUB_REF_NAME}-macos.tar.gz -C target/release traversal traversal-lsp

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: traversal-*.tar.gz

  build-windows:
    name: Build Windows binaries
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Build binaries
        run: cargo build --locked --release --workspace --bins

      - name: Package binaries
        shell: pwsh
        run: Compress-Archive -Path target/release/traversal.exe,target/release/traversal-lsp.exe -DestinationPath "traversal-$env:GITHUB_REF_NAME-windows.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: traversal-*.zip

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
